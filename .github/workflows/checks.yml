name: Cheap repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.2 pytest==9.1.1 pyyaml==6.0.3 ruff==0.16.6
      - run: python -m pytest -q
      - run: ruff check tools tests validation skills/jax-pytorch-porting/scripts
      - run: python tools/check_repo.py
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-package
          path: |
            dist/skill.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 7

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["validation/originals", ".work", ".venv", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"validation/*.py" = ["E402", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
